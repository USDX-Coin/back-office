name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check + build
        run: pnpm build

      - name: Unit tests (Vitest)
        run: pnpm test

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # Run the hermetic USDX-26 suite (mocked API — no backend, no credentials,
      # no on-chain side effects). The legacy per-ticket specs (usdx-39/47/51/...)
      # talk to the real BE via the Vite proxy and self-skip without creds; run
      # them separately with `pnpm test:e2e` once USDX_TEST_* secrets exist.
      - name: E2E tests (Playwright, hermetic)
        run: pnpm exec playwright test usdx-26

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
