name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

jobs:
  quality:
    name: Quality & Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # USDX-381 / OWASP-A06: blocking dependency-audit gate. Fails the build on
      # any high or critical advisory. Accepted transitive risks are documented
      # in package.json > pnpm.auditConfig.ignoreCves.
      - name: Dependency audit — blocking gate high+ (USDX-381)
        run: pnpm audit --audit-level=high

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check + build
        run: pnpm build

      - name: Unit tests (Vitest)
        run: pnpm test

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # Frontend-only E2E: the API is mocked in-test (no backend, no credentials,
      # no on-chain side effects). Backend behaviour is covered by the `backend`
      # repo's own test suite.
      - name: E2E tests (Playwright)
        run: pnpm test:e2e

      # Urutan merge: layar tertentu memanggil endpoint yang belum ada di server,
      # dan MSW TIDAK jalan di build yang di-deploy. Dijalankan SESUDAH test
      # supaya kegagalan test tetap yang dilaporkan duluan.
      #
      # `continue-on-error` disengaja: langkah ini menggambarkan keadaan SERVER,
      # bukan kualitas commit-nya. Memerahkan PR karena backend belum di-merge
      # akan melatih orang mengabaikan lampu merah. Yang dijaga adalah
      # ketersediaan jawabannya di halaman PR, bukan gerbangnya.
      - name: Kesiapan backend (urutan merge)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: pnpm cek:backend

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
